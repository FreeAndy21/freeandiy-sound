# FreeANDIY rebrand rules for this repository (applied by freeandiy/tools/rebrand, after the
# patches in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# Double-brace placeholders (e.g. this.name) come from branding.toml and app.toml (`rebrand vars`
# lists them). Every rule has a minimum match count: when upstream renames or moves something, the
# rule fails loudly instead of silently leaving the old brand in place.
#
# Protected text: rules first swap text that must keep the upstream name (cargo package names,
# file names we keep, upstream's copyright) for @@...@@ markers, and the last rules swap them
# back. The product name is replaced as a whole word in code: type names like `SoundCraftApp` stay.

templates = [
  "crates/ui-egui/src/freeandiy.rs",
]

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  "assets/app-icon",                             # upstream's identity; ours is copied in below
  "packaging/icons.sh",                          # icons come from the FreeANDIY meta repository
  "packaging/macos/dmg",                         # background and layout derived from upstream's icon; ours is copied in
  ".github/workflows/release.yml",               # upstream's release and platform jobs (ArtCraft's shared actions); ours: freeandiy*.yml
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/freebsd.yml",
]

# Translation catalogs: drop the Discord entries (the strings are gone from the UI); other
# ArtCraft mentions become FreeANDIY below, so complete catalogs stay complete.
[[drop_lines]]
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '^[^#\n]*Discord'
min = 0

# ---------------------------------------------------------------------------------------------
# Identifiers, maintainers, URLs.

[[replace]]
name = "app id"
include = ["**"]
exclude = ["**/*.md", "docs/**", "NOTICE", "ATTRIBUTION.md"]
find = "ai.storyteller.soundcraft"
replace = "{{this.app_id}}"
min = 10

[[replace]]
name = "developer id"
include = ["packaging/**"]
find = "ai.storyteller"
replace = "{{brand.id_prefix}}"
min = 0

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "SoundCraft maintainers <soundcraft@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 0

[[replace]]
name = "links in code: this app's page"
include = ["**/*.rs"]
find = "https://getartcraft.com/apps/soundcraft"
replace = "{{this.page}}"
min = 0

[[replace]]
name = "links in code: repository, releases, issues"
include = ["**/*.rs"]
exclude = ["vendor/**"]
find = "https://github.com/storytold/soundcraft"
replace = "{{this.github}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "link labels: this app's page (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
find = "getartcraft.com/apps/soundcraft"
replace = "freeandiy.freeandy.agency/{{this.key}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "link labels: source repository (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
find = "github.com/storytold/soundcraft"
replace = "github.com/{{brand.github_owner}}/{{this.repo}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "links in code: website"
include = ["**/*.rs"]
find = "https://getartcraft.com"
replace = "{{brand.website}}"
skip_comments = ["//"]
min = 0

[[replace]]
name = "labels: the website's host (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
exclude = ["xtask/**"]
find = "getartcraft.com"
replace = "freeandiy.freeandy.agency"
skip_comments = ["//"]
min = 0

[[replace]]
name = "website label (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
regex = 'ArtCraft [Ww]ebsite'
replace = "{{brand.name}} website"
min = 0

[[replace]]
name = "Crafting Apps"
include = ["crates/**/*.rs", "apps/**/*.rs", "packaging/**", "crates/ui-egui/src/i18n/*.tsv"]
find = "Crafting Apps"
replace = "{{brand.name}} apps"
min = 0

[[replace]]
name = "upstream issues URL"
include = ["packaging/**", ".github/**"]
find = "https://github.com/storytold/soundcraft/issues"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "upstream repository URL"
include = ["packaging/**", ".github/**"]
regex = 'https://github\.com/storytold/soundcraft(/|"|<|\x27|$)'
replace = "{{this.github}}${1}"
min = 0

[[replace]]
name = "upstream repo slug (raw URLs, GITHUB_REPOSITORY defaults)"
include = ["packaging/**", ".github/**"]
regex = 'storytold/soundcraft\b'
replace = "{{brand.github_owner}}/{{this.repo}}"
min = 0

[[replace]]
name = "upstream product page"
include = ["packaging/**", ".github/**", "apps/soundcraft-web/index.html"]
find = "https://getartcraft.com/apps/soundcraft"
replace = "{{this.page}}"
min = 0

[[replace]]
name = "upstream Discord (packaging contact/help links)"
include = ["packaging/**"]
find = "https://discord.gg/artcraft"
replace = "{{this.issues}}"
min = 0

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: upstream's copyright holder and contributors"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv", "packaging/**"]
regex = 'ArtCraft Team and the SoundCraft (contributors|authors)'
replace = 'ArtCraft Team and the @@UPSTREAM@@ ${1}'
min = 0

[[replace]]
name = "protect: upstream's copyright lines in the catalogs (ArtCraft, twice per line)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\n]*Copyright[^\n]*?)ArtCraft'
replace = '${1}@@AC@@'
min = 0

[[replace]]
name = "protect: upstream's copyright lines in the catalogs (ArtCraft, 2nd)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '(?m)^([^\n]*Copyright[^\n]*?)ArtCraft'
replace = '${1}@@AC@@'
min = 0

[[replace]]
name = "catalogs: other ArtCraft mentions"
include = ["crates/ui-egui/src/i18n/*.tsv"]
find = "ArtCraft"
replace = "{{brand.name}}"
min = 0

[[replace]]
name = "protect: attribution 'the SoundCraft authors'"
include = ["apps/*/build.rs", "packaging/**"]
find = "the SoundCraft authors"
replace = "{{brand.owner}} and the @@UPSTREAM@@ authors"
min = 0

[[replace]]
name = "web release zip: freeandiy-sound-<version>-web-wasm32.zip (before the crate-name protect)"
include = ["packaging/web/package.sh", "packaging/web/README.md", "docs/releasing.md"]
regex = 'soundcraft-web-(<version>|<v>|\$VERSION)'
replace = "{{this.repo}}-${1}-web-wasm32"
min = 0

[[replace]]
name = "protect: cargo -p / --package soundcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(-p|--package) soundcraft'
replace = '$1 @@PKG@@'
min = 1

[[replace]]
name = "protect: crate names soundcraft-<crate>"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'soundcraft-(au\-host|audio\-io|automation|clap\-host|dsp|engine|midi|mix|model|playback|time|ui\-egui|video|vst3\-host|web)\b'
replace = '@@PKG@@-$1'
min = 0

[[replace]]
name = "protect: cargo features soundcraft/<feature>"
include = ["packaging/**", ".github/**"]
find = "'soundcraft/"
replace = "'@@PKG@@/"
min = 0

[[replace]]
name = "protect: source paths apps/soundcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(apps[/\\])soundcraft'
replace = '${1}@@PKG@@'
min = 0

[[replace]]
name = "protect: crate idents soundcraft_"
include = ["packaging/**", ".github/**", "Dockerfile"]
find = "soundcraft_"
replace = "@@PKG@@_"
min = 0

[[replace]]
name = "protect: WiX sources soundcraft.wxs/.wxl"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'soundcraft(\.wxs|\.en-us\.wxl)'
replace = '@@PKG@@${1}'
min = 0

# ---------------------------------------------------------------------------------------------
# The product name in the UI, messages, translations, packaging and the web page.

[[replace]]
name = "Info.plist custom keys: SoundCraftVersion, SoundCraftBuildCommit"
include = ["packaging/**"]
regex = 'SoundCraft(Version|BuildCommit)'
replace = 'FreeANDIYSound${1}'
min = 0

[[replace]]
name = "product name after an escaped newline in strings (\\nSoundCraft)"
include = ["**/*.rs"]
exclude = ["xtask/**"]
find = '\nSoundCraft'
replace = '\n{{this.name}}'
skip_comments = ["//"]
min = 0

[[replace]]
name = "product name SoundCraft (Rust code, not comments; whole word)"
include = ["**/*.rs"]
exclude = ["xtask/**", "vendor/**"]
regex = '\bSoundCraft\b'
replace = "{{this.name}}"
skip_comments = ["//"]
min = 20

[[replace]]
name = "product name SoundCraft (catalogs: any script or inflection may follow it)"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = 'SoundCraft[a-z]*'
replace = "{{this.name}}"
min = 0

[[replace]]
name = "product name SoundCraft (packaging, web page, CI)"
include = ["packaging/**", "apps/soundcraft-web/index.html", ".github/**", "Dockerfile"]
exclude = ["**/*.md"]
regex = '\bSoundCraft\b'
replace = "{{this.name}}"
min = 10

# ---------------------------------------------------------------------------------------------
# Executables, packaging file names.

[[replace]]
name = "test binaries CARGO_BIN_EXE_soundcraft"
include = ["apps/**/*.rs"]
find = "CARGO_BIN_EXE_soundcraft"
replace = "CARGO_BIN_EXE_{{this.repo}}"
min = 0

[[replace]]
name = "cli executable name in code and catalogs"
include = ["apps/**/*.rs", "crates/**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
regex = '\bsoundcraft-cli\b'
replace = "{{this.repo}}-cli"
min = 0

[[replace]]
name = "icon file paths in code (assets/app-icon/soundcraft*)"
include = ["apps/**/*.rs", "crates/**/*.rs", "apps/*/build.rs", "xtask/**"]
find = "app-icon/soundcraft"
replace = "app-icon/{{this.repo}}"
min = 1

[[replace]]
name = "macOS window icon: our 1024 px tile"
include = ["apps/soundcraft/src/main.rs"]
find = "app-icon/{{this.repo}}-macos-512.png"
replace = "app-icon/{{this.repo}}-1024.png"
min = 1

[[replace]]
name = "windows exe resources"
include = ["apps/*/build.rs"]
regex = '"soundcraft(\.exe)?"'
replace = '"{{this.repo}}${1}"'
min = 0

[[replace]]
name = "packaging/CI: executables, file names, paths"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'soundcraft'
replace = "{{this.repo}}"
min = 20

[[replace]]
name = "MSI UpgradeCode (new GUID)"
include = ["packaging/windows/*.wxs"]
regex = 'UpgradeCode="[0-9A-Fa-f-]{36}"'
replace = 'UpgradeCode="{{this.msi_upgrade_code}}"'
min = 1

[[replace]]
name = "MSI component GUID 1 (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "091136D7-205E-41A8-9D27-5E231F7CBBD4"
replace = "{{this.msi_component_guid}}"
min = 1

[[replace]]
name = "MSI component GUID 2 (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "4552049A-C2F0-4AB0-BAE6-A62C3348F4B4"
replace = "{{msi.guid2}}"
min = 1

# ---------------------------------------------------------------------------------------------
# Restore protected text.

[[replace]]
name = "restore @@UPSTREAM@@"
include = ["**"]
find = "@@UPSTREAM@@"
replace = "{{this.upstream_name}}"
min = 0

[[replace]]
name = "restore @@AC@@ (upstream's copyright holder)"
include = ["**"]
find = "@@AC@@"
replace = "ArtCraft"
min = 0

[[replace]]
name = "restore @@PKG@@"
include = ["**"]
find = "@@PKG@@"
replace = "soundcraft"
min = 1

# ---------------------------------------------------------------------------------------------

# Upstream's README stays available; ours replaces it at the root.
[[rename]]
include = ["README.md"]
find = "README.md"
replace = "docs/upstream-README.md"
min = 1

[[rename]]
include = ["packaging/**"]
find = "ai.storyteller.soundcraft"
replace = "{{this.app_id}}"
min = 1

