# This repository's FreeANDIY settings (branding.toml is shared by all FreeANDIY repositories).
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream SoundCraft.

app = "sound" # which [apps.<id>] entry of branding.toml this repository builds

[build]
# cargo arguments for the release binaries, the tests sync-upstream.sh runs, and the web page.
bins = "-p soundcraft -p soundcraft-cli"
features = ""
tests = "-p soundcraft-ui-egui -p soundcraft-engine -p soundcraft -p soundcraft-cli"
web_index = "apps/soundcraft-web/index.html"
# Environment for tests (e.g. force the English UI) and for packaging/web/package.sh.
test_env = ""
web_env = ""
# Upstream runs its checks through ArtCraft's shared workflows, which this fork drops: our
# freeandiy.yml runs the tests.
ci_tests = "true"
# Executables checked for upstream branding (default: <repo> <repo>-cli).
# exes = ""

# Extra arguments after the test filter. Two crash-recovery UI tests pass on macOS but not on the
# Linux runner; upstream runs no Linux tests to compare with (FreeAndy21/freeandiy#1).
test_args = "-- --skip an_exit_without_quit_offers_unsaved_changes_at_the_next_launch --skip closing_the_session_or_quitting_drops_its_autosave"

[check]
# check-branding.sh: extra allowed strings (regex) and Rust paths where the upstream name may stay
# in string literals (git pathspecs, space-separated). The plugin-editor Win32 window classes are
# internal identifiers no user sees.
allow = "SoundCraft(Clap|Vst3)Editor"
rs_exclude = ":!xtask/**"

[msi]
# New component GUIDs for the FreeANDIY MSI (upstream's second component).
guid2 = "6EC5B698-5662-4A39-AEF3-C57BB6B02360"
